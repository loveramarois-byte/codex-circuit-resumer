name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Validate Python and configuration
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile src/daemon.py tests/real_machine_drill.py
          jq empty config.example.json
          zsh -n scripts/control.sh scripts/build_app.sh

      - name: Build macOS app
        run: |
          ./scripts/build_app.sh "$RUNNER_TEMP/CodexCircuitResumer.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/CodexCircuitResumer.app"

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Python tests on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile src/daemon.py tests/real_machine_drill.py windows/gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Analyze PowerShell
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error,Warning
          $results | Format-Table -AutoSize
          if ($results) { throw "PSScriptAnalyzer found $($results.Count) issue(s)." }

      - name: Build and smoke-test Windows package
        shell: pwsh
        run: |
          ./windows/build_windows.ps1 -OutputDir "$env:RUNNER_TEMP\windows-dist"
          ./windows/smoke_test.ps1 -Stage "$env:RUNNER_TEMP\windows-dist\CodexCircuitResumer-Windows-x64"

      - name: Microsoft Defender custom scan
        shell: pwsh
        run: |
          try { Update-MpSignature -ErrorAction Stop } catch { Write-Warning "Defender signature update unavailable: $($_.Exception.Message)" }
          $defender = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $defender)) {
            $defender = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $defender -or -not (Test-Path $defender)) { throw 'Microsoft Defender MpCmdRun.exe was not found.' }
          & $defender -Scan -ScanType 3 -File "$env:RUNNER_TEMP\windows-dist" -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed with code $LASTEXITCODE." }

      - uses: actions/upload-artifact@v4
        with:
          name: CodexCircuitResumer-Windows-x64
          path: ${{ runner.temp }}/windows-dist/*
