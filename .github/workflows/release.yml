name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Build and package macOS
        run: |
          ./scripts/build_app.sh "$RUNNER_TEMP/Codex熔断续聊.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Codex熔断续聊.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Codex熔断续聊.app" "$RUNNER_TEMP/CodexCircuitResumer-macOS-arm64.zip"
          cd "$RUNNER_TEMP"
          shasum -a 256 CodexCircuitResumer-macOS-arm64.zip > CodexCircuitResumer-macOS-arm64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: ${{ runner.temp }}/CodexCircuitResumer-macOS-arm64.zip*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test, analyze, build and scan
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error,Warning
          if ($results) { $results | Format-Table -AutoSize; throw 'PowerShell analysis failed.' }
          ./windows/build_windows.ps1 -OutputDir "$env:RUNNER_TEMP\windows-dist"
          ./windows/smoke_test.ps1 -Stage "$env:RUNNER_TEMP\windows-dist\CodexCircuitResumer-Windows-x64"
          try { Update-MpSignature -ErrorAction Stop } catch { Write-Warning "Defender signature update unavailable: $($_.Exception.Message)" }
          $defender = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $defender)) {
            $defender = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $defender -or -not (Test-Path $defender)) { throw 'Microsoft Defender MpCmdRun.exe was not found.' }
          & $defender -Scan -ScanType 3 -File "$env:RUNNER_TEMP\windows-dist" -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed with code $LASTEXITCODE." }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            ${{ runner.temp }}/windows-dist/CodexCircuitResumer-Windows-x64.zip
            ${{ runner.temp }}/windows-dist/CodexCircuitResumer-Windows-x64.zip.sha256

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "${GITHUB_REF_NAME} · macOS 与 Windows 同步版"
