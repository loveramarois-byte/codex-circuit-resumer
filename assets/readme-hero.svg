    <pattern id="grain" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="0.8" fill="#3C2E25" opacity="0.055"/>
      <circle cx="31" cy="20" r="0.65" fill="#3C2E25" opacity="0.045"/>
      <circle cx="17" cy="45" r="0.7" fill="#3C2E25" opacity="0.04"/>
      <circle cx="48" cy="39" r="0.55" fill="#3C2E25" opacity="0.04"/>
