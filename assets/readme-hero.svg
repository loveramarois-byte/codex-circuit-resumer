        <rect width="582" height="60" rx="14" fill="#F8F5EF" stroke="#E9E1D6"/>
        <circle cx="28" cy="30" r="8" fill="#D0A455"/>
        <text x="48" y="27" fill="#24211F" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="650">项目 C · 安全排队</text>
