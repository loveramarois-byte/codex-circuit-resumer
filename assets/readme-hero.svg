        <rect width="582" height="60" rx="14" fill="#F8F5EF" stroke="#E9E1D6"/>
        <circle cx="28" cy="30" r="8" fill="#C86F4A"/>
        <text x="48" y="27" fill="#24211F" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="650">项目 B · 自动续接中</text>
        <text x="48" y="45" fill="#827970" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="11">线路恢复 · 第 2 次尝试</text>
        <rect x="485" y="19" width="72" height="24" rx="12" fill="#F1E2D9"/>
        <text x="503" y="35" fill="#A65336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="11" font-weight="700">进行中</text>
