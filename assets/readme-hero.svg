    <path d="m37 14 4 6-7 1M21 44l-4-6 7-1" fill="none" stroke="#C86F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="25" fill="#1E1C1A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" letter-spacing="0">CODEX CIRCUIT RESUMER</text>
    <text x="78" y="50" fill="#766B62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">本地 · 安静 · 持续守望</text>
  </g>

  <g transform="translate(88 190)">
    <text x="0" y="0" fill="#1E1C1A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="58" font-weight="650" letter-spacing="0">线路会熔断，</text>
    <text x="0" y="72" fill="#B65F3E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="58" font-weight="650" letter-spacing="0">工作不必。</text>
    <text x="2" y="127" fill="#665D56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="21">线路恢复后，接回原对话；多个项目，安全排队继续。</text>
  </g>

