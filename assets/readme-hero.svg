<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title description">
  <title id="title">Codex Circuit Resumer</title>
  <desc id="description">A warm editorial illustration of API routes recovering and reconnecting interrupted coding conversations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#271E18" flood-opacity="0.10"/>
